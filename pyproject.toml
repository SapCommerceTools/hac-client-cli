[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hac-client-cli"
version = "0.1.0"
description = "CLI for SAP Commerce HAC client"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hac-client-core",
    "typer>=0.9.0",
    "rich>=13.0.0",
]

[project.scripts]
hac = "hac_client_cli.app:main"

